name: Simple Go Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Go version
        uses: actions/setup-go@v2
        with:
          go-version: "1.27.2"
      - run: go run hello-world.go
      - name: whatever
        env:
          FOO: ${{ secrets.FOO }}
        run: |
          echo "From context - ${{ secrets.FOO }}"
          echo "From custom env var - ${FOO}"
